name: Materialize portfolio media
# rerun after archive repair

on:
  push:
    paths:
      - ".github/workflows/materialize-media.yml"

permissions:
  contents: write

jobs:
  unpack-media:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify staged archive
        run: |
          ls -lh .publish/media.zip
          unzip -t .publish/media.zip

      - name: Unpack media
        run: unzip -o .publish/media.zip -d .

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Stage media
        run: git add media

      - name: Commit media
        run: |
          if git diff --cached --quiet; then
            echo "No media changes to commit."
          else
            git commit -m "Publish robotic workcell media"
          fi

      - name: Push media
        run: git push
